name: build

# Self-contained single-binary desktop builds (one `ytc` GUI per OS, like the
# handheld port). Windows and macOS compile a slim ffmpeg + libmpv from source
# (no external encoders / mpv extras); Linux bundles its app libraries with an
# $ORIGIN rpath so it runs on Steam Deck and any distro without system deps.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04   # older glibc/libstdc++ -> runs on newer hosts (Steam Deck, etc.)
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (NOT ffmpeg/mpv/libplacebo — built/omitted below)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build nasm pkg-config build-essential patchelf git python3-pip \
            libsdl2-dev libglew-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libass-dev libfribidi-dev libharfbuzz-dev libfreetype-dev libdav1d-dev
          # Ubuntu 22.04's meson (0.61) is too old for mpv 0.36 (needs >=0.62); use pip's.
          sudo pip3 install --upgrade meson
      - name: Build minimal FFmpeg 6.1 (matches mpv 0.36; decoders + mp4 mux, no encoders)
        run: |
          git clone --depth 1 -b n6.1 https://github.com/FFmpeg/FFmpeg ff
          cd ff
          ./configure --prefix="$GITHUB_WORKSPACE/ffout" \
            --disable-programs --disable-doc --disable-debug --disable-devices \
            --disable-encoders --disable-muxers --enable-muxer=mp4,mov,ipod \
            --enable-libdav1d --enable-shared --disable-static
          make -j"$(nproc)"
          make install
      - name: Build minimal libmpv (0.36, classic vo_gpu -> no libplacebo/shaderc)
        run: |
          git clone --depth 1 -b v0.36.0 https://github.com/mpv-player/mpv mp
          cd mp
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffout/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig"
          meson setup build -Dlibmpv=true -Dcplayer=false -Dlua=disabled \
            -Djavascript=disabled -Dlibplacebo=disabled -Dprefix="$GITHUB_WORKSPACE/mpvout"
          ninja -C build
          ninja -C build install
      - name: Build YTC (desktop OpenGL + GLEW; GLES2 fails over GLX on X11)
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffout/lib/pkgconfig:$GITHUB_WORKSPACE/mpvout/lib/pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PLAYER=OFF -DYTC_GL_DESKTOP=ON
          cmake --build build -j"$(nproc)"
      - name: Package (self-contained single binary)
        run: |
          mkdir -p dist/ytc/lib
          cp build/yt_ui dist/ytc/ytc
          # Bundle the app libraries; keep glibc / C++ runtime / GL / X11 / Wayland /
          # driver libs from the host (bundling those breaks GL or clashes with drivers).
          ldd dist/ytc/ytc | awk '/=> \//{print $3}' | while read -r so; do
            b=$(basename "$so")
            case "$b" in
              libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|ld-linux*|\
              libgcc_s.so*|libstdc++.so*|\
              libGL.so*|libGLX*|libEGL*|libGLdispatch*|libOpenGL*|libglapi*|libgbm*|libdrm*|\
              libX11*|libxcb*|libXext*|libXau*|libXdmcp*|libXrandr*|libXrender*|libXfixes*|\
              libXi*|libXcursor*|libXinerama*|libXss*|libXxf86vm*|\
              libwayland*|libxkbcommon*) : ;;
              *) cp -n "$so" dist/ytc/lib/ 2>/dev/null || true ;;
            esac
          done
          patchelf --set-rpath '$ORIGIN/lib' dist/ytc/ytc
          for so in dist/ytc/lib/*; do patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true; done
          strip dist/ytc/ytc dist/ytc/lib/* 2>/dev/null || true
          cp -r config data dist/ytc/
          curl -fsSL https://curl.se/ca/cacert.pem -o dist/ytc/data/cacert.pem || true
          echo "=== linux bundle ==="; du -sh dist/ytc; echo "external deps:"; ldd dist/ytc/ytc | grep '=>' | grep -v "$PWD" | head
      - uses: actions/upload-artifact@v4
        with:
          name: ytc-linux-x86_64
          path: dist/ytc

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (keep libplacebo/libass/dav1d; NOT ffmpeg/mpv)
        run: |
          brew install cmake meson ninja nasm pkg-config curl sdl2 glew dylibbundler \
            libplacebo libass freetype fribidi harfbuzz little-cms2 dav1d
      - name: Build minimal FFmpeg (decoders + mp4 mux; no external encoders)
        run: |
          git clone --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg ff
          cd ff
          ./configure --prefix="$GITHUB_WORKSPACE/ffout" \
            --disable-programs --disable-doc --disable-debug --disable-devices \
            --disable-encoders --disable-muxers --enable-muxer=mp4,mov,ipod \
            --enable-libdav1d --enable-shared --disable-static
          make -j"$(sysctl -n hw.ncpu)"
          make install
      - name: Build minimal libmpv (render API; no lua/js/extras)
        run: |
          git clone --depth 1 -b v0.39.0 https://github.com/mpv-player/mpv mp
          cd mp
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffout/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          meson setup build -Dlibmpv=true -Dcplayer=false -Dlua=disabled \
            -Djavascript=disabled -Dprefix="$GITHUB_WORKSPACE/mpvout"
          ninja -C build
          ninja -C build install
      - name: Build YTC against the slim ffmpeg + mpv
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffout/lib/pkgconfig:$GITHUB_WORKSPACE/mpvout/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PLAYER=OFF -DYTC_GL_DESKTOP=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Package (self-contained single binary)
        run: |
          mkdir -p dist/ytc
          cp build/yt_ui dist/ytc/ytc
          dylibbundler -od -b -x dist/ytc/ytc -d dist/ytc/libs -p @executable_path/libs \
            -s "$GITHUB_WORKSPACE/ffout/lib" -s "$GITHUB_WORKSPACE/mpvout/lib" || true
          strip -x dist/ytc/ytc dist/ytc/libs/*.dylib 2>/dev/null || true
          # strip + install_name_tool invalidate signatures; Apple Silicon kills
          # invalidly-signed Mach-Os, so ad-hoc re-sign everything (libs first).
          codesign --force --sign - dist/ytc/libs/*.dylib 2>/dev/null || true
          codesign --force --sign - dist/ytc/ytc 2>/dev/null || true
          cp -r config data dist/ytc/
          curl -fsSL https://curl.se/ca/cacert.pem -o dist/ytc/data/cacert.pem || true
          echo "=== macos bundle ==="; du -sh dist/ytc
      - uses: actions/upload-artifact@v4
        with:
          name: ytc-macos
          path: dist/ytc

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-dav1d
      - name: Build minimal FFmpeg (no external encoders)
        run: |
          git clone --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg ff
          cd ff
          ./configure --prefix="$(pwd)/../ffout" \
            --disable-programs --disable-doc --disable-debug --disable-devices \
            --disable-encoders --disable-muxers --enable-muxer=mp4,mov,ipod \
            --enable-libdav1d --enable-shared --disable-static
          make -j"$(nproc)"
          make install
      - name: Build minimal libmpv (render API)
        run: |
          git clone --depth 1 -b v0.39.0 https://github.com/mpv-player/mpv mp
          cd mp
          export PKG_CONFIG_PATH="$(pwd)/../ffout/lib/pkgconfig:/mingw64/lib/pkgconfig"
          meson setup build -Dlibmpv=true -Dcplayer=false -Dlua=disabled \
            -Djavascript=disabled -Dprefix="$(pwd)/../mpvout"
          ninja -C build
          ninja -C build install
      - name: Build YTC against the slim ffmpeg + mpv
        run: |
          export PKG_CONFIG_PATH="$(pwd)/ffout/lib/pkgconfig:$(pwd)/mpvout/lib/pkgconfig:/mingw64/lib/pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PLAYER=OFF -DYTC_GL_DESKTOP=ON
          cmake --build build -j"$(nproc)"
      - name: Package (self-contained single binary + DLLs)
        run: |
          mkdir -p dist/ytc
          cp build/yt_ui.exe dist/ytc/ytc.exe
          export PATH="$(pwd)/ffout/bin:$(pwd)/mpvout/bin:$PATH"
          ldd dist/ytc/ytc.exe 2>/dev/null | awk '/mingw64|ffout|mpvout/ {print $3}' | while read -r dll; do
            [ -f "$dll" ] && cp -n "$dll" dist/ytc/ || true
          done
          strip dist/ytc/*.exe dist/ytc/*.dll 2>/dev/null || true
          cp -r config data dist/ytc/
          curl -fsSL https://curl.se/ca/cacert.pem -o dist/ytc/data/cacert.pem || true
          echo "=== windows bundle ==="; du -sh dist/ytc
      - uses: actions/upload-artifact@v4
        with:
          name: ytc-windows-x86_64
          path: dist/ytc
