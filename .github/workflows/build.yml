name: build

# Cross-platform desktop builds. Linux builds the full app; macOS and Windows
# build the core + CLI tools, and the full SDL2/GLES2 GUI wherever the GL deps
# resolve (Windows via MSYS2 mesa; macOS GUI still needs an ANGLE/GL step — WIP).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config build-essential \
            libsdl2-dev libgles2-mesa-dev libcurl4-openssl-dev \
            libmpv-dev libavformat-dev libavcodec-dev libavutil-dev
      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PLAYER=OFF
          cmake --build build -j"$(nproc)"
      - name: Package
        run: |
          mkdir -p dist/ytc
          for b in yt_ui yt_resolve yt_search yt_cast; do
            [ -f "build/$b" ] && cp "build/$b" dist/ytc/ || true
          done
          strip dist/ytc/yt_* 2>/dev/null || true
          cp -r config data dist/ytc/
          curl -fsSL https://curl.se/ca/cacert.pem -o dist/ytc/data/cacert.pem || true
      - uses: actions/upload-artifact@v4
        with:
          name: ytc-linux-x86_64
          path: dist/ytc

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja pkg-config curl mpv ffmpeg sdl2 glew dylibbundler
      - name: Configure & build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PLAYER=OFF -DYTC_GL_DESKTOP=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Package (bundle dylibs so the GUI is self-contained)
        run: |
          mkdir -p dist/ytc
          for b in yt_ui yt_resolve yt_search yt_cast; do
            [ -f "build/$b" ] && cp "build/$b" dist/ytc/ || true
          done
          if [ -f dist/ytc/yt_ui ]; then
            dylibbundler -od -b -x dist/ytc/yt_ui -d dist/ytc/libs -p @executable_path/libs || true
          fi
          strip -x dist/ytc/yt_* dist/ytc/libs/*.dylib 2>/dev/null || true
          cp -r config data dist/ytc/
          curl -fsSL https://curl.se/ca/cacert.pem -o dist/ytc/data/cacert.pem || true
      - uses: actions/upload-artifact@v4
        with:
          name: ytc-macos
          path: dist/ytc

  # Experimental slim macOS build: ffmpeg + libmpv compiled from source WITHOUT the
  # external video encoders (x265/aom/SVT-AV1 ≈ 38 MB) and mpv's scripting/extras,
  # keeping only what a decode-and-render YouTube client needs. Uploaded separately
  # so the known-good `macos` job keeps producing a working artifact meanwhile.
  macos-slim:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (keep libplacebo/libass/dav1d; NOT ffmpeg/mpv)
        run: |
          brew install cmake meson ninja nasm pkg-config curl sdl2 glew dylibbundler \
            libplacebo libass freetype fribidi harfbuzz little-cms2 dav1d
      - name: Build minimal FFmpeg (decoders + mp4 mux; no external encoders)
        run: |
          git clone --depth 1 -b n7.1 https://github.com/FFmpeg/FFmpeg ff
          cd ff
          ./configure --prefix="$GITHUB_WORKSPACE/ffout" \
            --disable-programs --disable-doc --disable-debug --disable-devices \
            --disable-encoders --disable-muxers --enable-muxer=mp4,mov,ipod \
            --enable-libdav1d --enable-shared --disable-static
          make -j"$(sysctl -n hw.ncpu)"
          make install
      - name: Build minimal libmpv (render API; no lua/js/extras)
        run: |
          git clone --depth 1 -b v0.39.0 https://github.com/mpv-player/mpv mp
          cd mp
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffout/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig"
          meson setup build -Dlibmpv=true -Dcplayer=false -Dlua=disabled \
            -Djavascript=disabled -Dprefix="$GITHUB_WORKSPACE/mpvout"
          ninja -C build
          ninja -C build install
      - name: Build YTC against the slim ffmpeg + mpv
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffout/lib/pkgconfig:$GITHUB_WORKSPACE/mpvout/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PLAYER=OFF -DYTC_GL_DESKTOP=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Package + measure
        run: |
          mkdir -p dist/ytc
          cp build/yt_ui dist/ytc/ || true
          dylibbundler -od -b -x dist/ytc/yt_ui -d dist/ytc/libs -p @executable_path/libs \
            -s "$GITHUB_WORKSPACE/ffout/lib" -s "$GITHUB_WORKSPACE/mpvout/lib" || true
          strip -x dist/ytc/yt_* dist/ytc/libs/*.dylib 2>/dev/null || true
          cp -r config data dist/ytc/
          curl -fsSL https://curl.se/ca/cacert.pem -o dist/ytc/data/cacert.pem || true
          echo "=== slim bundle size ==="; du -sh dist/ytc
          echo "=== biggest dylibs ==="; ls -S dist/ytc/libs | head -15
      - uses: actions/upload-artifact@v4
        with:
          name: ytc-macos-slim
          path: dist/ytc

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-mpv
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-glew
      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PLAYER=OFF -DYTC_GL_DESKTOP=ON
          cmake --build build -j"$(nproc)"
      - name: Package (exe + dependent DLLs)
        run: |
          mkdir -p dist/ytc
          for b in yt_ui yt_resolve yt_search yt_cast; do
            [ -f "build/$b.exe" ] && cp "build/$b.exe" dist/ytc/ || true
          done
          # Copy the mingw DLLs each exe needs (best-effort via ldd).
          for exe in dist/ytc/*.exe; do
            ldd "$exe" 2>/dev/null | awk '/mingw64/ {print $3}' | while read -r dll; do
              [ -f "$dll" ] && cp -n "$dll" dist/ytc/ || true
            done
          done
          strip dist/ytc/*.exe dist/ytc/*.dll 2>/dev/null || true
          cp -r config data dist/ytc/
          curl -fsSL https://curl.se/ca/cacert.pem -o dist/ytc/data/cacert.pem || true
      - uses: actions/upload-artifact@v4
        with:
          name: ytc-windows-x86_64
          path: dist/ytc
